<!DOCTYPE html>

<title>SF Parts - My Database</title>

<!-- Add your custom spacing here -->
<style>
  .sp-ds .hl .sz {
    margin-left: 10px; /* Adjust this number to move it more or less to the right */
  }

  /* 1. Hull Base Performance tab */
  #sp-hull .sp-base {
    margin-left: 340px; 
  }

  /* 2. Main Sail Base Performance tab */
  #sp-main-sail .sp-base {
    margin-left: 258px; 
  }

  /* 3. Gun Ports Base Performance tab */
  #sp-gun-ports .sp-base {
    margin-left: 258px; 
  }

  /* 4. Armaments Base Performance tab */
  #sp-armaments .sp-base {
    margin-left: 270px; 
  }

  /* 5. Panels Base Performance tab */
  #sp-armaments-paneling .sp-base {
    margin-left: 135px; 
  }

  /* Panels detail box (opens at the right of the Panels list) */
  .skill-row > .pnl-pd { margin-top: -20px; }
  .loc-panel.pnl-pd.open { width: 310px; height: 278px; margin-left: 0; }
  .pd-in { width: 250px; height: 202px; }
  .pd-img { display: block; width: 250px; height: 202px; }
  #sp-armaments-paneling .sp-row { cursor: pointer; }
  #sp-armaments-paneling .sp-row.sp-sel .sp-nm { color: #fff; }
  #sp-armaments-paneling .sp-row:hover:not(:has(.hl i:hover)) .sp-nm { color: #fff; text-decoration: underline; }   /* same hover as the site links */
</style>
</head>

    return (parseInt(m[0], 10) + parseInt(m[m.length - 1], 10)) / 2;

  // Builds the rows. Click a stat icon (inside <i data-k="key">) = sort highest first, click again = lowest first,

    var key = null, dir = -1;

      var rows = items.map(function (s, i) { return { s: s, i: i, v: key === null ? null : rng(s[key]) }; });

        if (x.v === null || y.v === null) return x.v === y.v ? x.i - y.i : (x.v === null ? 1 : -1);
        return (dir * (x.v - y.v)) || (x.i - y.i);

      if (list._flt) rows = rows.filter(function (o) { return list._flt(o.s); });

        r.innerHTML = rowHtml(o.s); fill(r, o.s);
        if (key !== null) { var on = r.querySelector('i[data-k="' + key + '"]'); if (on) on.classList.add('sp-on'); }
        list.appendChild(r);

      if (!rows.length) { var em = document.createElement('div'); em.className = 'sh-empty'; em.textContent = 'No panels found'; list.appendChild(em); }
      list.scrollTop = 0;
    }
    list.addEventListener('click', function (e) {
      var ic = e.target.closest('.hl i[data-k] img'); if (!ic) return;
      var k = ic.parentNode.getAttribute('data-k');
      if (key === k) dir = -dir; else { key = k; dir = -1; }
      render();
    });
    list._render = render;
    render();

  (function () {

    function apply() {
      var q = inp.value.trim().toLowerCase().replace(/\s+/g, ' '), toks = q.length >= 3 ? q.split(' ') : [];
      L._flt = toks.length ? function (s) { var nm = s.n.toLowerCase(); return toks.every(function (t) { return startsWord(nm, t); }); } : null;

    }
    inp.addEventListener('input', apply);

  var pdSel = null, pdBox = document.getElementById('pd-box'), pdIn = pdBox.querySelector('.pd-in');

  }
