(function () {
  var R = '../../images/';
  var sg = function (v) { return (v >= 0 ? '+' : '') + v; };
  // Fills a list with one row per item. Click a stat icon: highest first; click it again: lowest first. Another icon starts highest first again.
  function setup(list, items, rowHtml, val, fill, initKey, tieKeys) {
    var sortKey = (initKey === undefined ? null : initKey), sortDir = -1;
    function render() {
      var rows = items.map(function (s, i) { return { s: s, i: i }; });
      if (sortKey !== null) rows.sort(function (x, y) {
        var d = sortDir * (val(x.s, sortKey) - val(y.s, sortKey));
        if (d) return d;
        if (tieKeys) for (var t = 0; t < tieKeys.length; t++) {
          if (tieKeys[t] === sortKey) continue;
          d = sortDir * (val(x.s, tieKeys[t]) - val(y.s, tieKeys[t]));
          if (d) return d;
        }
        return x.i - y.i;
      });
      list.innerHTML = '';
      rows.forEach(function (o) {
        var r = document.createElement('div'); r.className = 'sp-row';
        r.innerHTML = rowHtml(o.s);
        fill(r, o.s);
        if (sortKey !== null) { var on = r.querySelector('[data-k="' + sortKey + '"]'); if (on) on.classList.add('sp-on'); }
        list.appendChild(r);
      });
      list.scrollTop = 0;
    }
    list.addEventListener('click', function (e) {
      var ic = e.target.closest('.sp-st img'); if (!ic) return;
      var k = ic.parentNode.getAttribute('data-k');
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
      render();
    });
    render();
  }

    function (s) {
      return (s.i ? '<img class="sp-ic" src="' + R + 'ship-parts/sails/' + s.i + '.png" alt="">' : '<span class="sp-ic"></span>') + '<span class="sp-nm"></span>' +
        '<span class="sp-st"><span data-k="a"><img src="' + R + 'ships/ico-sail.png" alt=""><b>' + sg(s.a) + '</b></span>' +
        '<span data-k="b"><img src="' + R + 'ships/ico-mast.png" alt=""><b>' + sg(s.b) + '</b></span>' +
        '<span data-k="t"><img src="' + R + 'ships/ico-turn.png" alt=""><b>' + s.t + '</b></span></span>';
    },
    function (s, k) { return Number(s[k]); },
    function (r, s) { r.querySelector('.sp-nm').textContent = s.n; }, 'a', ['a', 'b', 't']);

  var ST = ['wave', 'face', 'man', 'bottle'];
  setup(document.getElementById('sp-figs-list'), FIGS,

      var st = '';

        (s.f ? '<img src="' + R + 'ship-parts/fx-' + s.f + '.png" alt="">' : '<i></i>') + '<span></span></span>';
    },

  setup(document.getElementById('sp-double-list'), DOUBLES,

      return '<img class="sp-ic" src="' + R + 'ship-parts/grapeshot/' + s.i + '.png" alt=""><span class="sp-nm"></span><span class="sp-st">' + st + '</span>';
    },
    function (s, k) { return s.s[k]; },

  setup(document.getElementById('sp-chain-list'), CHAINS,
    function (s) {
      var st = '';
      for (var k = 0; k < 5; k++) st += '<span data-k="' + k + '"><img src="' + R + 'ship-parts/ns-st' + (k + 1) + '.png" alt=""><b>' + s.s[k] + '</b></span>';
      return '<img class="sp-ic" src="' + R + 'ship-parts/chain-shot/' + s.i + '.png" alt=""><span class="sp-nm"></span><span class="sp-st">' + st + '</span>';
    },

  setup(document.getElementById('sp-incend-list'), INCENDS,

  setup(document.getElementById('sp-smoke-list'), SMOKES,
    function (s) {

      for (var k = 0; k < 5; k++) st += '<span data-k="' + k + '"><img src="' + R + 'ship-parts/ns-st' + (k + 1) + '.png" alt=""><b>' + s.s[k] + '</b></span>';
      return (s.i ? '<img class="sp-ic" src="' + R + 'ship-parts/smoke-shells/' + s.i + '.png" alt="">' : '<span class="sp-ic"></span>') + '<span class="sp-nm"></span><span class="sp-st">' + st + '</span>';
    },
    function (s, k) { return s.s[k]; },
    function (r, s) { r.querySelector('.sp-nm').textContent = s.n; }, '0', ['0', '1', '2', '3', '4']);
})();
</script>
